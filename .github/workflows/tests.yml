name: Software checks
on: [push, pull_request]
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: dashboard
      - run: python tools/analyze_results.py --check
      - run: cc -std=c99 -Wall -Wextra -Werror tests/native/test_buffer.c -o /tmp/test_buffer
      - run: /tmp/test_buffer
      - run: cc -std=c99 -Wall -Wextra -Werror tests/native/test_policy.c -o /tmp/test_policy
      - run: /tmp/test_policy
      - run: cc -std=c99 -Wall -Wextra -Werror -Itests/native/led_mocks tests/native/test_led.c -o /tmp/test_led
      - run: /tmp/test_led
